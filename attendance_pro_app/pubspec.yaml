name: attendance_pro_app
description: A production-ready attendance tracking application for cross-platform deployment.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  webview_flutter: ^4.4.2
  url_launcher: ^6.2.1
  table_calendar: ^3.0.9
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  intl: ^0.18.1
  motion: ^0.0.1
  pdf: ^3.10.7
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

pluginManagement {
    def localProperties = new Properties()
    def localPropertiesFile = new File(settingsDir, 'local.properties')
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withReader('UTF-8') { reader ->
            localProperties.load(reader)
        }
    }

    def flutterSdkPath = localProperties.getProperty('flutter.sdk')
    if (flutterSdkPath == null) {
        flutterSdkPath = System.getenv('FLUTTER_ROOT')
    }
    if (flutterSdkPath == null) {
        flutterSdkPath = "/opt/flutter"
    }

    if (flutterSdkPath != null) {
        flutterSdkPath = flutterSdkPath.trim()
        if (flutterSdkPath.startsWith('"') && flutterSdkPath.endsWith('"')) {
            flutterSdkPath = flutterSdkPath.substring(1, flutterSdkPath.length() - 1)
        } else if (flutterSdkPath.startsWith("'") && flutterSdkPath.endsWith("'")) {
            flutterSdkPath = flutterSdkPath.substring(1, flutterSdkPath.length() - 1)
        }
        flutterSdkPath = flutterSdkPath.trim()
    }

    // Try standard fallback paths on Windows if the SDK isn't present at the configured path
    def settingsDirFile = new File("${flutterSdkPath}/packages/flutter_tools/gradle")
    if (!settingsDirFile.exists()) {
        def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
        if (isWindows) {
            def standardPaths = [
                "C:\\src\\flutter",
                "C:\\flutter",
                "D:\\src\\flutter",
                "D:\\flutter",
                "C:\\tools\\flutter",
                "C:\\src\\flutter-sdk",
                "C:\\Users\\" + System.getProperty("user.name") + "\\AppData\\Local\\Flutter\\ephemeral"
            ]
            for (path in standardPaths) {
                if (new File("${path}/packages/flutter_tools/gradle").exists()) {
                    flutterSdkPath = path
                    break
                }
            }
        }
    }

    includeBuild "${flutterSdkPath}/packages/flutter_tools/gradle"
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
    id "com.android.application" version "7.3.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
    id "com.google.gms.google-services" version "4.3.15" apply false
}

include ':app'
